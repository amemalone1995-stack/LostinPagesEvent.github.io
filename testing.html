
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Panelled Guests | Lost In Pages Events</title>

<!-- GOOGLE FONTS -->

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* =================================
   CSS START
================================= */

/* =================================
   VARIABLES
================================= */

:root {

    --midnight: #080d25;

    --spine-pyramid: linear-gradient(
      315deg,
      transparent 75%,
      rgba(255, 255, 255, 0.1) 0
      ),
      linear-gradient(
        45deg,
        transparent 75%,
        rgba(255, 255, 255, 0.1) 0
      ),
      linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.2) 166px,
        transparent 0
      ),
      linear-gradient(
        45deg,
        rgba(0, 0, 0, 0.1) 75%,
        transparent 0
      );

    --spine-stairs: repeating-linear-gradient(
        63deg,
        rgba(255, 255, 255, 0.1),
        rgba(255, 255, 255, 0.1) 1px,
        transparent 3px,
        transparent 0
      ),
      linear-gradient(
        127deg,
        rgba(255, 255, 255, 0.1),
        rgba(255, 255, 255, 0.1) 90px,
        transparent 55%,
        transparent 0
      ),
      linear-gradient(
        transparent 51%,
        rgba(0, 0, 0, 0.1) 170px
      );

    --spine-argyle: repeating-linear-gradient(
        120deg,
        rgba(255, 255, 255, 0.1),
        rgba(255, 255, 255, 0.1) 1px,
        transparent 1px,
        transparent 60px
      ),
      repeating-linear-gradient(
        60deg,
        rgba(255, 255, 255, 0.1),
        rgba(255, 255, 255, 0.1) 1px,
        transparent 1px,
        transparent 60px
      ),
      linear-gradient(
        60deg,
        rgba(0, 0, 0, 0.1) 25%,
        transparent 25%,
        transparent 75%,
        rgba(0, 0, 0, 0.1) 75%,
        rgba(0, 0, 0, 0.1)
      ),
      linear-gradient(
        120deg,
        rgba(0, 0, 0, 0.1) 25%,
        transparent 25%,
        transparent 75%,
        rgba(0, 0, 0, 0.1) 75%,
        rgba(0, 0, 0, 0.1)
      );

    --spine-tartan: repeating-linear-gradient(
        transparent,
        transparent 50px,
        rgba(0, 0, 0, 0.4) 50px,
        rgba(0, 0, 0, 0.4) 53px,
        transparent 53px,
        transparent 63px,
        rgba(0, 0, 0, 0.4) 63px,
        rgba(0, 0, 0, 0.4) 66px,
        transparent 66px,
        transparent 116px,
        rgba(0, 0, 0, 0.5) 116px,
        rgba(0, 0, 0, 0.5) 166px,
        rgba(255, 255, 255, 0.2) 166px,
        rgba(255, 255, 255, 0.2) 169px,
        rgba(0, 0, 0, 0.5) 169px,
        rgba(0, 0, 0, 0.5) 179px,
        rgba(255, 255, 255, 0.2) 179px,
        rgba(255, 255, 255, 0.2) 182px,
        rgba(0, 0, 0, 0.5) 182px,
        rgba(0, 0, 0, 0.5) 232px,
        transparent 232px
      ),
      repeating-linear-gradient(
        270deg,
        transparent,
        transparent 50px,
        rgba(0, 0, 0, 0.4) 50px,
        rgba(0, 0, 0, 0.4) 53px,
        transparent 53px,
        transparent 63px,
        rgba(0, 0, 0, 0.4) 63px,
        rgba(0, 0, 0, 0.4) 66px,
        transparent 66px,
        transparent 116px,
        rgba(0, 0, 0, 0.5) 116px,
        rgba(0, 0, 0, 0.5) 166px,
        rgba(255, 255, 255, 0.2) 166px,
        rgba(255, 255, 255, 0.2) 169px,
        rgba(0, 0, 0, 0.5) 169px,
        rgba(0, 0, 0, 0.5) 179px,
        rgba(255, 255, 255, 0.2) 179px,
        rgba(255, 255, 255, 0.2) 182px,
        rgba(0, 0, 0, 0.5) 182px,
        rgba(0, 0, 0, 0.5) 232px,
        transparent 232px
      ),
      repeating-linear-gradient(
        125deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.2) 2px,
        rgba(0, 0, 0, 0.2) 3px,
        transparent 3px,
        transparent 5px,
        rgba(0, 0, 0, 0.2) 5px
      );

}

/* =================================
   BOOKSHELF
================================= */

.bookshelf {
    width: 100%;
    margin-top: 32px;
    display: flex;
    flex-wrap: wrap;
}

.book {
    width: 50px;
    height: 280px;
    position: relative;
    margin-left: 1px;
    transform-style: preserve-3d;
    transform: translateZ(0) rotateY(0);
    transition: transform 1s;
}

.side {
    position: absolute;
    border: 2px solid black;
    border-radius: 3px;
    font-weight: bold;
    color: black;
    text-align: center;
    transform-origin: center left;
}

.spine {
    position: relative;
    width: 50px;
    height: 280px;
    background-image: var(--spine-tartan);
    background-size: 70px 120px;
    transform: rotateY(0deg) translateZ(0px);
}

.spine-title {
    margin: 2px;
    position: absolute;
    top: 0px;
    left: 0px;
    font-size: 12px;
    color: gold;
    writing-mode: vertical-rl;
    text-orientation: mixed;
}

.spine-author {
    position: absolute;
    color: goldenrod;
    bottom: 0px;
    left: 20%;
}

.top {
    width: 50px;
    height: 190px;
    top: -2px;
    background-image: linear-gradient(90deg, white 90%, gray 10%);
    background-size: 5px 5px;
    transform: rotateX(90deg) translateZ(95px) translateY(-95px);
}

.cover {
    width: 190px;
    height: 280px;
    top: 0px;
    background-color: grey;
    background-size: contain;
    background-repeat: round;
    left: 50px;
    transform: rotateY(90deg) translateZ(0);
    transition: transform 1s;
}

.book:hover {
    z-index: 1;
    transform: rotateX(-25deg) rotateY(-40deg) rotateZ(-15deg) translateY(50px)
      translateX(-30px);
}


/* =================================
   RESET
================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =================================
   PAGE
================================= */

body {
    font-family: 'Inter', sans-serif;
    background: var(--midnight);
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}


/* =================================
   STAR BACKGROUND
================================= */

#stars,
#shooting-stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {
    0%, 100% {
        opacity: .2;
    }

    50% {
        opacity: 1;
    }
}


/* =================================
   CONTENT LAYER
================================= */

header,
.container,
footer {
    position: relative;
    z-index: 2;
}


/* =================================
   HEADER
================================= */

header {
    text-align: center;
    padding: 70px 20px 40px;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 4rem;
    color: white;
    margin-bottom: 15px;
}

.subtitle {
    font-size: 1.2rem;
    letter-spacing: 2px;
}


/* =================================
   BOOK COVER
================================= */

.cover {
    position: absolute;
    left: 35px;
    top: 0;
    width: 145px;
    height: 250px;
    background-size: cover;
    background-position: center;
    border: 1px solid rgba(255,255,255,.3);
    box-shadow: 5px 5px 15px rgba(0,0,0,.35);
}


/* =================================
   BOOK TOP
================================= */

.top {
    position: absolute;
    top: -10px;
    left: 35px;
    width: 145px;
    height: 10px;
    background: #eeeeee;
}


/* =================================
   BOOK INFORMATION
================================= */

.book-info {
    text-align: center;
    margin-top: 15px;
    font-family: 'Playfair Display', serif;
    font-size: 14px;
}


/* =================================
   FOOTER
================================= */

footer {
    text-align: center;
    padding: 30px;
    color: white;
    font-size: 13px;
}


/* =================================
   MOBILE
================================= */

@media (max-width: 600px) {

    h1 {
        font-size: 3rem;
    }

    .bookshelf {
        gap: 25px;
        padding: 30px 5px;
    }

    .book {
        transform: scale(.9);
        margin: -5px;
    }

    .book:hover {
        transform: scale(.9) translateY(-12px);
    }

}

</style>

</head>


<body>


<!-- =================================
     BACKGROUND ELEMENTS
================================= -->

<div id="stars"></div>
<div id="shooting-stars"></div>



<!-- =================================
     HEADER
================================= -->

<header>

    <h1>Our Panelled Guests</h1>

    <p class="subtitle">
        Authors
    </p>

</header>



<!-- =================================
     MAIN CONTENT
================================= -->

<div class="container">


    <!-- =================================
         AUTHOR BOOKSHELF
    ================================= -->

    <div class="bookshelf">


        <!-- BOOK ONE -->

        <div class="book">

            <div class="side spine">

                <span class="spine-title">
                    Blade Runner
                </span>

                <span class="spine-author">
                    RS
                </span>

            </div>

            <div class="side top"></div>

            <div
                class="side cover"
                style="background-image: url('https://janhendrikewers.uk/static/img/bookshelf/1.jpg');">
            </div>

            <div class="book-info">
                Blade Runner
            </div>

        </div>



        <!-- BOOK TWO -->

        <div class="book">

            <div class="side spine">

                <span class="spine-title">
                    The Midnight Library
                </span>

                <span class="spine-author">
                    MH
                </span>

            </div>

            <div class="side top"></div>

            <div
                class="side cover"
                style="background-image: url('https://janhendrikewers.uk/static/img/bookshelf/1.jpg');">
            </div>

            <div class="book-info">
                The Midnight Library
            </div>

        </div>



        <!-- BOOK THREE -->

        <div class="book">

            <div class="side spine">

                <span class="spine-title">
                    The Book Thief
                </span>

                <span class="spine-author">
                    MS
                </span>

            </div>

            <div class="side top"></div>

            <div
                class="side cover"
                style="background-image: url('https://janhendrikewers.uk/static/img/bookshelf/1.jpg');">
            </div>

            <div class="book-info">
                The Book Thief
            </div>

        </div>


    </div>

</div>



<!-- =================================
     FOOTER
================================= -->

<footer>

    Lost In Pages Events

</footer>



<!-- =================================
     JAVASCRIPT
================================= -->

<script>

/* =================================
   FIXED BOOK SIZES
================================= */

const bookSizes = [
    { height: 260, width: 42 },
    { height: 220, width: 55 },
    { height: 280, width: 45 }
];

document.querySelectorAll(".book").forEach(function(book, i) {

    const size = bookSizes[i];

    if (!size) return;

    const spine = book.querySelector(".spine");
    const cover = book.querySelector(".cover");
    const top = book.querySelector(".top");

    book.style.width = size.width + "px";
    book.style.height = "280px";

    spine.style.width = size.width + "px";
    spine.style.height = size.height + "px";

    cover.style.height = size.height + "px";
    cover.style.top = (280 - size.height) + "px";

    top.style.top = (280 - size.height) + "px";

});


/* =================================
   RANDOM BOOK PATTERNS
================================= */

function randomChoice(array) {

    return array[
        Math.floor(Math.random() * array.length)
    ];

}

const availablePatterns = [
    "argyle",
    "tartan",
    "stairs",
    "pyramid"
];

const patternSizes = {
    argyle: "70px 120px",
    tartan: "232px 232px",
    stairs: "70px 120px",
    pyramid: "20px 20px"
};

document.querySelectorAll(".spine").forEach(function(spine) {

    const randomPattern = randomChoice(availablePatterns);

    spine.style.backgroundImage =
        `var(--spine-${randomPattern})`;

    spine.style.backgroundSize =
        patternSizes[randomPattern];

});


/* =================================
   STAR BACKGROUND GENERATOR
================================= */

const starsContainer = document.getElementById("stars");

for (let i = 0; i < 100; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "%";

    star.style.top = Math.random() * 100 + "%";

    const size = Math.random() * 3 + 1;

    star.style.width = size + "px";

    star.style.height = size + "px";

    star.style.animationDelay = Math.random() * 3 + "s";

    starsContainer.appendChild(star);

}

</script>


</body>
</html>
