
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Panelled Guests | Lost In Pages Events</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ===============================
   VARIABLES
================================ */

:root {
    --midnight: #15110e;
    --antique-gold: #c5a46d;
    --aged-gold: #927044;
    --parchment: #e6d5b5;

    --burgundy: #54252d;
    --forest: #263d32;
    --navy: #252e46;
    --brown: #493323;
    --dusty-green: #59644a;
}

/* ===============================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ===============================
   PAGE
================================ */

   body {
    font-family: 'Inter', sans-serif;
    background: #243b70;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

/* ===============================
   STAR BACKGROUND
================================ */

#stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {
    0%, 100% { opacity: .2; }
    50% { opacity: 1; }
}

/* ===============================
   CONTENT
================================ */

header,
.container,
footer {
    position: relative;
    z-index: 2;
}

/* ===============================
   HEADER
================================ */

header {
    text-align: center;
    padding: 70px 20px 45px;
}

h1 {
    font-family: 'Great Vibes', cursive;
    font-size: 4rem;
    font-weight: 400;
    color: var(--parchment);
    margin-bottom: 15px;
    text-shadow: 0 3px 15px rgba(0,0,0,.8);
}

.subtitle {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--antique-gold);
}

/* ===============================
   BOOKSHELF
================================ */

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.bookshelf {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: center;
    gap: 28px;

    padding: 40px 15px 20px;

    border-bottom: 12px solid #806044;

    box-shadow:
        0 12px 15px rgba(0,0,0,.2);

    background: transparent;
}


/* ===============================
   BOOK STRUCTURE
================================ */

.book {
    --book-colour: #54252d;
    --book-light: #79434a;
    --book-dark: #291419;

    position: relative;

    width: var(--book-width, 55px);
    height: var(--book-height, 280px);

    transform-style: preserve-3d;

    perspective: 1000px;

    transition:
        transform .7s ease,
        filter .7s ease;

    cursor: pointer;

    filter: drop-shadow(5px 8px 5px rgba(0,0,0,.5));
}

/* Individual leather colours */

.book.burgundy {
    --book-colour: #54252d;
    --book-light: #874b50;
    --book-dark: #291116;
}

.book.forest {
    --book-colour: #263d32;
    --book-light: #496b53;
    --book-dark: #14251c;
}

.book.navy {
    --book-colour: #252e46;
    --book-light: #465777;
    --book-dark: #11182b;
}

.book.brown {
    --book-colour: #493323;
    --book-light: #795b3c;
    --book-dark: #25180f;
}

.book.green {
    --book-colour: #59644a;
    --book-light: #83916a;
    --book-dark: #303a27;
}

/* ===============================
   BOOK SPINE
================================ */

.spine {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    border-radius: 5px 3px 3px 5px;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.65) 0%,
            rgba(255,255,255,.08) 8%,
            transparent 18%,
            rgba(255,255,255,.06) 45%,
            transparent 70%,
            rgba(0,0,0,.35) 100%
        ),
        linear-gradient(
            180deg,
            var(--book-light),
            var(--book-colour) 35%,
            var(--book-dark) 65%,
            var(--book-colour)
        );

    border: 1px solid rgba(197,164,109,.65);

    box-shadow:
        inset 3px 0 5px rgba(255,255,255,.12),
        inset -3px 0 5px rgba(0,0,0,.5),
        inset 0 0 12px rgba(0,0,0,.3),
        3px 0 5px rgba(0,0,0,.5);
}

/* Raised spine bands */

.spine::before {
    content: "";

    position: absolute;

    top: 12px;
    bottom: 12px;
    left: 5px;
    right: 5px;

    border-left: 2px solid rgba(197,164,109,.8);
    border-right: 2px solid rgba(197,164,109,.8);

    box-shadow:
        inset 3px 0 3px rgba(0,0,0,.25),
        inset -3px 0 3px rgba(0,0,0,.25);

    pointer-events: none;
}

/* Decorative gold bands */

.spine::after {
    content: "";

    position: absolute;

    left: 3px;
    right: 3px;

    top: 12px;
    height: 6px;

    border-top: 1px solid var(--antique-gold);
    border-bottom: 1px solid var(--antique-gold);

    box-shadow:
        0 6px 0 -2px rgba(197,164,109,.7),
        0 230px 0 -1px rgba(197,164,109,.6),
        0 236px 0 -1px rgba(197,164,109,.7);

    pointer-events: none;
}

/* ===============================
   SPINE LETTERING
================================ */

.spine-title {
    position: absolute;

    top: 38px;
    left: 50%;

    transform: translateX(-50%);

    writing-mode: vertical-rl;

    text-orientation: mixed;

    font-family: 'Playfair Display', serif;

    font-size: 12px;
    font-weight: 600;

    letter-spacing: 1.5px;

    text-transform: uppercase;

    color: #e2c58c;

    text-shadow:
        1px 1px 1px #21150b,
        0 0 5px rgba(0,0,0,.8);

    white-space: nowrap;
}

.spine-author {
    position: absolute;

    bottom: 17px;
    left: 50%;

    transform: translateX(-50%);

    font-family: 'Playfair Display', serif;

    font-size: 10px;

    color: var(--parchment);

    letter-spacing: 2px;
}

/* ===============================
   TOP OF BOOK - AGED PAPER
================================ */

.book-top {
    position: absolute;

    top: -7px;
    left: 4px;

    width: calc(100% - 8px);
    height: 14px;

    transform: rotateX(90deg);
    transform-origin: bottom;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(100,75,45,.22) 0px,
            transparent 1px,
            transparent 3px
        ),
        linear-gradient(
            90deg,
            #a88b60,
            #f0dfbd 15%,
            #e6d5b5 75%,
            #9b805b
        );

    border-top: 1px solid #bda77f;

    box-shadow:
        inset 0 2px 3px rgba(255,255,255,.5),
        inset 0 -2px 3px rgba(0,0,0,.25);
}

/* ===============================
   BOOK COVER
================================ */

.book-cover {
    position: absolute;

    width: 185px;
    height: 100%;

    left: 100%;
    top: 0;

    transform-origin: left center;

    transform: rotateY(90deg);

    border: 4px solid #8e7044;

    border-radius: 3px;

    background-size: cover;
    background-position: center;

    box-shadow:
        inset 0 0 15px rgba(0,0,0,.6),
        inset 0 0 3px rgba(255,255,255,.4),
        4px 0 8px rgba(0,0,0,.5);
}

/* ===============================
   BOOK INFORMATION
================================ */

.book-info {
    position: absolute;

    top: calc(100% + 16px);
    left: 50%;

    transform: translateX(-50%);

    width: 150px;

    text-align: center;

    font-family: 'Playfair Display', serif;

    font-size: 13px;

    color: var(--parchment);
}

/* ===============================
   HOVER EFFECT
================================ */

.book:hover {
    z-index: 10;

    transform:
        translateY(-18px)
        rotateY(-12deg)
        rotateZ(-2deg);

    filter:
        drop-shadow(10px 18px 12px rgba(0,0,0,.7));
}

/* ===============================
   FOOTER
================================ */

footer {
    text-align: center;

    padding: 65px 20px 30px;

    color: var(--antique-gold);

    font-family: 'Playfair Display', serif;

    font-size: 14px;

    letter-spacing: 2px;
}

/* ===============================
   MOBILE
================================ */

@media (max-width: 600px) {

    header {
        padding-top: 50px;
    }

    h1 {
        font-size: 3rem;
    }

    .subtitle {
        font-size: .9rem;
        letter-spacing: 3px;
    }

    .bookshelf {
        gap: 24px;
        padding: 30px 5px 55px;
    }

    .book {
        transform: scale(.9);
    }

    .book:hover {
        transform: scale(.9) translateY(-12px);
    }

}

/* Reduced motion accessibility */

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}

</style>
</head>

<>

<div id="stars"></div>

<header>

    <h1>Our Panelled Guests</h1>

    <p class="subtitle">Authors</p>

</header>

<main class="container">

    <div class="bookshelf">

        <!-- BOOK ONE -->

        <div class="book burgundy"
             style="--book-height:260px; --book-width:48px;">

            <div class="spine">

                <span class="spine-title">
                    Maiden
                </span>

                <span class="spine-author">
                    GL
                </span>

            </div>

            <div class="book-top"></div>

            <div class="book-cover"
                 style="background-image:url('https://janhendrikewers.uk/static/img/bookshelf/1.jpg');">
            </div>

      

        </div>


        <!-- BOOK TWO -->

        <div class="book forest"
             style="--book-height:230px; --book-width:55px;">

            <div class="spine">

                <span class="spine-title">
                    Weavingshaw
                </span>

                <span class="spine-author">
                    HA-W
                </span>

            </div>

            <div class="book-top"></div>

            <div class="book-cover"
                 style="background-image:url('https://janhendrikewers.uk/static/img/bookshelf/1.jpg');">
            </div>

         

        </div>


        <!-- BOOK THREE -->

        <div class="book navy"
             style="--book-height:280px; --book-width:46px;">

            <div class="spine">

                <span class="spine-title">
                    The Light That Blinds Us
                </span>

                <span class="spine-author">
                    ADT
                </span>

            </div>

            <div class="book-top"></div>

            <div class="book-cover"
                 style="background-image:url('https://janhendrikewers.uk/static/img/bookshelf/1.jpg');">
            </div>

        </div>

    </div>

</main>

<footer>
    Lost In Pages Events
</footer>

<script>

/* ===============================
   STAR BACKGROUND
================================ */

const starsContainer = document.getElementById("stars");

for (let i = 0; i < 100; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    const size = Math.random() * 3 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.animationDelay =
        Math.random() * 3 + "s";

    starsContainer.appendChild(star);

}

</script>

</body>
</html>
