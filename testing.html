
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Panelled Guests | Lost In Pages Events</title>

<!-- GOOGLE FONTS -->

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">


<style>

/* =================================
   ROOT VARIABLES
================================= */

:root {

    --midnight: #4838DB;
    --white: #FFFFFF;
    --glass: rgba(255,255,255,0.12);
    --border: rgba(255,255,255,0.35);

    /* BOOK PATTERNS */

    --argyle:
        repeating-linear-gradient(
            45deg,
            #ffffff33 0 2px,
            transparent 2px 15px
        ),
        repeating-linear-gradient(
            -45deg,
            #ffffff33 0 2px,
            transparent 2px 15px
        );

    --tartan:
        repeating-linear-gradient(
            90deg,
            transparent 0 10px,
            #ffffff55 10px 13px
        ),
        repeating-linear-gradient(
            0deg,
            transparent 0 10px,
            #ffffff55 10px 13px
        );

    --stairs:
        repeating-linear-gradient(
            135deg,
            #ffffff33 0 5px,
            transparent 5px 15px
        );

    --pyramid:
        linear-gradient(
            315deg,
            transparent 75%,
            rgba(255,255,255,0.1) 0
        ),
        linear-gradient(
            45deg,
            transparent 75%,
            rgba(255,255,255,0.1) 0
        ),
        linear-gradient(
            135deg,
            rgba(255,255,255,0.2) 25%,
            transparent 0
        ),
        linear-gradient(
            45deg,
            rgba(0,0,0,0.1) 75%,
            transparent 0
        );

}


/* =================================
   RESET
================================= */

* {

    margin: 0;
    padding: 0;
    box-sizing: border-box;

}


/* =================================
   PAGE
================================= */

body {

    font-family: 'Inter', sans-serif;
    background: var(--midnight);
    color: white;
    min-height: 100vh;
    overflow-x: hidden;

}


/* =================================
   STAR BACKGROUND
================================= */

#stars,
#shooting-stars {

    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;

}

.star {

    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;

}

@keyframes twinkle {

    0%, 100% {
        opacity: .2;
    }

    50% {
        opacity: 1;
    }

}


/* =================================
   CONTENT LAYER
================================= */

header,
.container,
footer {

    position: relative;
    z-index: 2;

}


/* =================================
   HEADER
================================= */

header {

    text-align: center;
    padding: 70px 20px 40px;

}

h1 {

    font-family: 'Great Vibes', cursive;
    font-size: 4rem;
    color: white;
    margin-bottom: 15px;

}

.subtitle {

    font-size: 1.2rem;
    letter-spacing: 2px;

}


/* =================================
   MAIN CONTAINER
================================= */

.container {

    width: 90%;
    max-width: 1100px;
    margin: auto;
    padding-bottom: 50px;

}


/* =================================
   BOOKSHELF
================================= */

.bookshelf {

    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
    gap: 35px;
    padding: 50px 20px;

}


/* =================================
   BOOK
================================= */

.book {

    width: 180px;
    height: 260px;
    position: relative;
    perspective: 1000px;
    transition: transform .3s ease;
    cursor: pointer;

}

.book:hover {

    transform: translateY(-12px);

}


/* =================================
   BOOK SPINE
================================= */

.spine {

    position: absolute;
    left: 0;
    top: 0;

    width: 35px;
    height: 250px;

    background-color: #29205f;
    background-size: 20px 20px;

    border: 1px solid rgba(255,255,255,.3);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-around;

    padding: 10px 3px;

    z-index: 2;

    box-shadow:
        inset -4px 0 5px rgba(0,0,0,.25);

}

.spine-title {

    writing-mode: vertical-rl;
    transform: rotate(180deg);

    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 600;

    color: white;

}

.spine-author {

    font-size: 10px;
    color: white;

}


/* =================================
   BOOK COVER
================================= */

.cover {

    position: absolute;

    left: 35px;
    top: 0;

    width: 145px;
    height: 250px;

    background-size: cover;
    background-position: center;

    border: 1px solid rgba(255,255,255,.3);

    box-shadow:
        5px 5px 15px rgba(0,0,0,.35);

}


/* =================================
   BOOK TOP
================================= */

.top {

    position: absolute;

    top: -10px;
    left: 35px;

    width: 145px;
    height: 10px;

    background: #eeeeee;

}


/* =================================
   BOOK INFORMATION
================================= */

.book-info {

    text-align: center;
    margin-top: 15px;
    font-family: 'Playfair Display', serif;
    font-size: 14px;

}


/* =================================
   FOOTER
================================= */

footer {

    text-align: center;
    padding: 30px;
    color: white;
    font-size: 13px;

}


/* =================================
   MOBILE
================================= */

@media (max-width: 600px) {

    h1 {

        font-size: 3rem;

    }

    .bookshelf {

        gap: 25px;
        padding: 30px 5px;

    }

    .book {

        transform: scale(.9);
        margin: -5px;

    }

    .book:hover {

        transform: scale(.9) translateY(-12px);

    }

}

</style>

</head>


<body>


<!-- =================================
     BACKGROUND ELEMENTS
================================= -->

<div id="stars"></div>
<div id="shooting-stars"></div>



<!-- =================================
     HEADER
================================= -->

<header>

    <h1>Our Panelled Guests</h1>

    <p class="subtitle">
        Authors
    </p>

</header>



<!-- =================================
     MAIN CONTENT
================================= -->

<div class="container">


    <!-- =================================
         AUTHOR BOOKSHELF
    ================================= -->

    <div class="bookshelf">


        <!-- BOOK ONE -->

        <div class="book">

            <div class="side spine">

                <span class="spine-title">
                    Blade Runner
                </span>

                <span class="spine-author">
                    RS
                </span>

            </div>

            <div class="side top"></div>

            <div
                class="side cover"
                style="background-image: url('https://janhendrikewers.uk/static/img/bookshelf/1.jpg');">
            </div>

            <div class="book-info">
                Blade Runner
            </div>

        </div>



        <!-- BOOK TWO -->

        <div class="book">

            <div class="side spine">

                <span class="spine-title">
                    The Midnight Library
                </span>

                <span class="spine-author">
                    MH
                </span>

            </div>

            <div class="side top"></div>

            <div
                class="side cover"
                style="background-image: url('https://janhendrikewers.uk/static/img/bookshelf/1.jpg');">
            </div>

            <div class="book-info">
                The Midnight Library
            </div>

        </div>



        <!-- BOOK THREE -->

        <div class="book">

            <div class="side spine">

                <span class="spine-title">
                    The Book Thief
                </span>

                <span class="spine-author">
                    MS
                </span>

            </div>

            <div class="side top"></div>

            <div
                class="side cover"
                style="background-image: url('https://janhendrikewers.uk/static/img/bookshelf/1.jpg');">
            </div>

            <div class="book-info">
                The Book Thief
            </div>

        </div>


    </div>

</div>



<!-- =================================
     FOOTER
================================= -->

<footer>

    Lost In Pages Events

</footer>



<!-- =================================
     JAVASCRIPT
================================= -->

<script>


/* =================================
   RANDOM BOOK PATTERNS
================================= */

const availablePatterns = [

    "argyle",
    "tartan",
    "stairs",
    "pyramid"

];


function randomChoice(array) {

    return array[
        Math.floor(Math.random() * array.length)
    ];

}


document.querySelectorAll(".spine").forEach(function(spine) {

    const randomPattern = randomChoice(availablePatterns);

    spine.style.backgroundImage =
        `var(--${randomPattern})`;

});



/* =================================
   STAR BACKGROUND GENERATOR
================================= */

const starsContainer = document.getElementById("stars");

for (let i = 0; i < 100; i++) {

    const star = document.createElement("div");

    star.className = "star";

    star.style.left = Math.random() * 100 + "%";

    star.style.top = Math.random() * 100 + "%";

    const size = Math.random() * 3 + 1;

    star.style.width = size + "px";

    star.style.height = size + "px";

    star.style.animationDelay = Math.random() * 3 + "s";

    starsContainer.appendChild(star);

}


</script>


</body>
</html>
